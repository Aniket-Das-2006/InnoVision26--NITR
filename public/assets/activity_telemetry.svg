<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>

    <!-- Neon Green Pulse Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <!-- Area Fill Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#16a34a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pulse Dot Glow -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .metric-title { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #4ade80; letter-spacing: 2px; text-transform: uppercase; }
    .metric-value { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #f3f4f6; }
    .metric-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; fill: #9ca3af; letter-spacing: 1px; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #22c55e; }
    
    @keyframes lineDraw {
      0% { stroke-dashoffset: 2000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulsePoint {
      0% { r: 4; opacity: 1; }
      50% { r: 8; opacity: 0.4; }
      100% { r: 4; opacity: 1; }
    }

    @keyframes liveScan {
      0% { transform: translateX(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateX(820px); opacity: 0; }
    }

    .sparkline-line {
      stroke-dasharray: 2000;
      animation: lineDraw 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pulse-dot {
      animation: pulsePoint 2s ease-in-out infinite;
    }

    .scan-beam {
      animation: liveScan 6s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="898" height="238" x="1" y="1" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid -->
  <rect width="860" height="150" x="20" y="70" fill="url(#gridPattern)" />

  <!-- Horizontal Axis Markings -->
  <line x1="20" y1="90" x2="880" y2="90" stroke="#1f2937" stroke-width="0.75" stroke-dasharray="3,3" stroke-opacity="0.6" />
  <line x1="20" y1="130" x2="880" y2="130" stroke="#1f2937" stroke-width="0.75" stroke-dasharray="3,3" stroke-opacity="0.6" />
  <line x1="20" y1="170" x2="880" y2="170" stroke="#1f2937" stroke-width="0.75" stroke-dasharray="3,3" stroke-opacity="0.6" />
  <line x1="20" y1="210" x2="880" y2="210" stroke="#334155" stroke-width="1" stroke-opacity="0.8" />

  <!-- Header Section -->
  <g transform="translate(30, 24)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="86" height="22" rx="11" fill="#14532d" fill-opacity="0.4" stroke="#22c55e" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#22c55e" />
    <text x="24" y="15" class="badge-text">HEALTHY</text>

    <!-- Title & Metric -->
    <text x="106" y="15" class="metric-title">TELEMETRY ACTIVITY &amp; REPOSITORY VELOCITY</text>
    <text x="730" y="15" class="metric-label">STREAM: 60 FPS / REALTIME</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(30, 48)">
    <text x="0" y="18" class="metric-value">99.98%</text>
    <text x="0" y="30" class="metric-label">UPTIME</text>

    <text x="130" y="18" class="metric-value">60 FPS</text>
    <text x="130" y="30" class="metric-label">WEBGL 2.0</text>

    <text x="260" y="18" class="metric-value">12.4 ms</text>
    <text x="260" y="30" class="metric-label">AUDIO LATENCY</text>

    <text x="390" y="18" class="metric-value">256</text>
    <text x="390" y="30" class="metric-label">MODULE COMMITS</text>

    <text x="510" y="18" class="metric-value">0.0 ms</text>
    <text x="510" y="30" class="metric-label">HASH ROUTE DELAY</text>
  </g>

  <!-- Shaded Area Path -->
  <path d="M 30 210
           L 30 148
           Q 60 172 85 130
           T 140 142
           T 190 108
           T 235 158
           T 280 120
           T 325 146
           T 370 98
           T 420 160
           T 470 125
           T 520 85
           T 570 145
           T 620 90
           T 670 115
           T 720 78
           T 770 102
           T 820 68
           L 870 74
           L 870 210
           Z"
        fill="url(#areaGrad)" />

  <!-- Animated Glowing Stroke Sparkline Path -->
  <path class="sparkline-line"
        d="M 30 148
           Q 60 172 85 130
           T 140 142
           T 190 108
           T 235 158
           T 280 120
           T 325 146
           T 370 98
           T 420 160
           T 470 125
           T 520 85
           T 570 145
           T 620 90
           T 670 115
           T 720 78
           T 770 102
           T 820 68
           L 870 74"
        fill="none"
        stroke="url(#strokeGrad)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Scanning Vertical Laser Beam -->
  <g class="scan-beam" transform="translate(30, 70)">
    <line x1="0" y1="0" x2="0" y2="140" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="0" cy="140" r="3" fill="#4ade80" />
  </g>

  <!-- Peak Data Nodes -->
  <circle cx="190" cy="108" r="3.5" fill="#4ade80" stroke="#064e3b" stroke-width="1.5" />
  <circle cx="370" cy="98" r="3.5" fill="#4ade80" stroke="#064e3b" stroke-width="1.5" />
  <circle cx="520" cy="85" r="3.5" fill="#4ade80" stroke="#064e3b" stroke-width="1.5" />
  <circle cx="620" cy="90" r="3.5" fill="#4ade80" stroke="#064e3b" stroke-width="1.5" />
  <circle cx="720" cy="78" r="3.5" fill="#4ade80" stroke="#064e3b" stroke-width="1.5" />

  <!-- Current Live Head Node (Active Pulse) -->
  <circle class="pulse-dot" cx="870" cy="74" r="5" fill="#22c55e" filter="url(#dotGlow)" />
  <circle cx="870" cy="74" r="3" fill="#ffffff" />

  <!-- Axis Timestamp Ticks -->
  <g transform="translate(0, 226)">
    <text x="30" y="0" class="metric-label">T-30D</text>
    <text x="190" y="0" class="metric-label">T-24D</text>
    <text x="370" y="0" class="metric-label">T-18D</text>
    <text x="520" y="0" class="metric-label">T-12D</text>
    <text x="670" y="0" class="metric-label">T-6D</text>
    <text x="836" y="0" class="metric-label">LIVE: NOW</text>
  </g>
</svg>
